<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sib NYC Trip – offline backup</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <style>
    @page { size: A4; margin: 11mm 11mm 12mm; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; color: #14213D; font-size: 9.6pt; line-height: 1.35; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #render { position: absolute; left: -10000px; top: 0; width: 930px; height: 600px; }
    .page { page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .band { border-radius: 8px; color: #fff; padding: 8px 12px; display: flex; align-items: baseline; gap: 10px; }
    .band .d { font-weight: 800; font-size: 13pt; letter-spacing: .02em; white-space: nowrap; }
    .band .t { font-weight: 700; font-size: 12pt; }
    .meta { margin: 6px 2px 6px; color: #3D4A63; font-size: 9pt; }
    .meta b { color: #14213D; }
    .mapimg { width: 100%; border-radius: 8px; border: 1px solid #ddd; display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 6px; }
    td { padding: 3.2px 4px; vertical-align: top; border-bottom: 1px solid #ECE6DA; }
    td.time { width: 13mm; font-weight: 700; color: #6B7487; white-space: nowrap; }
    td.n { width: 7mm; }
    td.cost { width: 18mm; text-align: right; color: #3D4A63; white-space: nowrap; }
    .num { display: inline-block; width: 17px; height: 17px; border-radius: 50%; color: #fff; text-align: center; font-weight: 800; font-size: 8pt; line-height: 17px; }
    .num.food { border-radius: 4px; }
    .num.hub { background: #fff !important; border: 2px solid; width: 13px; height: 13px; margin: 2px; }
    .name { font-weight: 700; }
    .note { color: #4E5A70; font-size: 8.6pt; }
    .flag { font-size: 7.6pt; font-weight: 700; background: #FCEBD0; color: #8A5300; padding: 0 4px; border-radius: 3px; margin-left: 4px; }
    .via { color: #6B7487; font-size: 8.4pt; font-style: italic; }
    .tips { margin: 6px 2px 0; padding-left: 14px; color: #3D4A63; font-size: 8.8pt; }
    .tick { display: inline-block; width: 10px; height: 10px; border: 1.2px solid #9AA1AE; border-radius: 2px; margin-right: 2px; vertical-align: -1px; }
    .cover h1 { font-size: 30pt; margin: 30mm 0 2mm; letter-spacing: -.01em; }
    .cover h2 { font-size: 13pt; color: #6B7487; margin: 0 0 10mm; font-weight: 600; }
    .cover h3 { font-size: 10pt; text-transform: uppercase; letter-spacing: .08em; color: #6B7487; margin: 8mm 0 2mm; }
    .cover ul { padding-left: 16px; margin: 0; }
    .cover li { margin: 2px 0; }
    .key { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4mm; }
    .key span { display: inline-flex; align-items: center; gap: 5px; }
    .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .home { text-align: center; padding: 40mm 0; font-size: 14pt; }
  </style>
</head>
<body>
  <div id="render"></div>
  <div id="pages">Rendering…</div>
  <script type="module" src="js/print.js"></script>
</body>
</html>
